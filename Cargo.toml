[workspace]
resolver = "2"
members = [
    "crates/lyre-core",
    "crates/lyre-audio",
    "crates/lyre-audio-simd",
    "crates/lyre-audio-exclusive",
    "crates/lyre-ui",
    "crates/lyre-app",
]

[workspace.package]
version = "0.2.7"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lyre-core = { path = "crates/lyre-core" }
lyre-audio = { path = "crates/lyre-audio" }
lyre-ui = { path = "crates/lyre-ui" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

# gpui-pre 是 Zed main 的快照分叉，必须与 gpui-component 0.8.1 钉的版本一致（`=0.3.10`），
# 否则会解析出两份 gpui 而类型不匹配。
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.10" }
gpui-component = "0.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "allow"
unused_lifetimes = "warn"

[workspace.lints.clippy]
# 分组给负 priority，下面的单条规则才覆盖得住它们
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
clone_on_ref_ptr = "warn"
needless_pass_by_value = "warn"
too_many_arguments = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
float_cmp = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
unreadable_literal = "allow"
wildcard_imports = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
assert_is_empty = "allow"

# GPUI 的渲染管线在纯 debug 下交互明显发滞，依赖统一开 opt-level=2；依赖不生成调试信息，
# 冷编译的时间和 rustc 峰值内存有相当一部分花在调试信息上，自己的 crate 仍保留。
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# vendor 的 gpui-pre-windows 补齐无标题栏窗口四边四角的缩放热区；改动与重做步骤见 `vendor/gpui-pre-windows/PATCH.md`。
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
